analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored / unused local package stubs (not in pubspec; breaks analyze).
    - packages/**
    # Web-only impl (dart:html / dart:js_util); analyzed via conditional import.
    - lib/core/web/web_image_clipboard_web.dart
  include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
