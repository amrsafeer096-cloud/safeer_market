name: Deploy web to Firebase Hosting

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # --pwa-strategy=none: do not emit flutter_service_worker.js (stale
        # Chrome cache). firebase-messaging-sw.js is untouched for web push.
        run: flutter build web --release --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project safeer-market --non-interactive
